
#include <Wire.h>
#include <LiquidCrystal_I2C.h>

LiquidCrystal_I2C lcd(0x27, 16, 2);

const int MQ_PIN = A0;
const int BUTTON_PIN = 2;

bool demoMode = true;
int simulatedValue = 20;

int lastButtonState = HIGH;
unsigned long pressStart = 0;
unsigned long lastChange = 0;
bool longPressDone = false;

void setup() {
  pinMode(BUTTON_PIN, INPUT_PULLUP);

  lcd.init();
  lcd.backlight();

  lcd.setCursor(0, 0);
  lcd.print("AIR GUARD");
  lcd.setCursor(0, 1);
  lcd.print("Starting...");
  
  Serial.begin(9600);
  delay(1500);
  lcd.clear();
}

void loop() {
  handleButton();

  int rawValue = analogRead(MQ_PIN);

  lcd.setCursor(0, 0);

  if (demoMode) {
    lcd.print("DEMO Value: ");
    lcd.print(simulatedValue);
    lcd.print("   ");

    lcd.setCursor(0, 1);

    if (simulatedValue < 50) {
      lcd.print("Demo: LOW       ");
    } else if (simulatedValue < 100) {
      lcd.print("Demo: MEDIUM    ");
    } else {
      lcd.print("Demo: HIGH      ");
    }
  } else {
    lcd.print("MQ135 Raw: ");
    lcd.print(rawValue);
    lcd.print("    ");

    lcd.setCursor(0, 1);
    lcd.print("Gas sensor mode ");
  }

  Serial.print("MQ135 raw reading: ");
  Serial.println(rawValue);

  delay(150);
}

void handleButton() {
  int current = digitalRead(BUTTON_PIN);

  if (current != lastButtonState &&
      millis() - lastChange > 30) {

    lastChange = millis();
    lastButtonState = current;

    if (current == LOW) {
      pressStart = millis();
      longPressDone = false;
    } else {
      if (!longPressDone && demoMode) {
        simulatedValue += 10;

        if (simulatedValue > 150) {
          simulatedValue = 20;
        }
      }

      pressStart = 0;
    }
  }

  if (current == LOW &&
      pressStart != 0 &&
      !longPressDone &&
      millis() - pressStart >= 1200) {

    demoMode = !demoMode;
    longPressDone = true;
    lcd.clear();
  }
}
